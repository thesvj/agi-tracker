site_name: AGI Tracker
site_description: A precise definition of AGI, five measurable tests, and dated evidence on how close AI is.
site_url: https://thesvj.github.io/agi-tracker/
repo_url: https://github.com/thesvj/agi-tracker
repo_name: thesvj/agi-tracker
edit_uri: ""
copyright: Text CC BY 4.0 · Jamalpoor Sai Varun

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - attr_list

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - What is AGI?: definition.md
  - Tracker: tracker.md
  - Survey: survey.md
  - Timeline: timeline.md
  - Learn:
      - learn/index.md
      - 00 What is AGI?: learn/00-defining-agi.md
      - 01 Transformers: learn/01-transformers.md
      - 02 Scaling laws: learn/02-scaling.md
      - 03 Post-training: learn/03-post-training.md
      - 04 Reasoning: learn/04-reasoning.md
      - 05 Agents: learn/05-agents.md
      - 06 Generalisation: learn/06-generalisation.md
      - 07 Memory: learn/07-memory.md
      - 08 World models: learn/08-world-models.md
      - 09 Science: learn/09-science.md
      - 10 Safety: learn/10-safety.md
      - 11 Measurement: learn/11-measurement.md
  - Ideas: ideas.md
